spring:
  application:
    name: think_different
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  servlet:
    context-path: /

holiday:
  api:
    key: ${HOLIDAY_API_KEY}

weather:
  api:
    key: ${WEATHER_API_KEY}