<!doctype html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/login}">
<head>
    <title>Join</title>
    <th:block layout:fragment="head">
        <link rel="stylesheet" th:href="@{/css/member/join.css}">
    </th:block>
    <th:block layout:fragment="script">
        <script th:src="@{/js/member/join.js}"></script>
    </th:block>
</head>
<body>
    <th:block layout:fragment="content">
        <div class="join-container">
            <form class="join-form" th:action="@{/members}" th:object="${memberRequestDto}" method="post">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <h2 class="join-title">회원가입</h2>

                <input type="text" th:field="*{name}" placeholder="이름" required>
                <span class="msg error-msg" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>

                <div class="input-box">
                    <input type="text" th:field="*{loginId}" placeholder="아이디" required>
                    <button type="button" id="check-id">중복 체크</button>
                </div>
                <span id="loginId-msg" class="msg"
                      th:classappend="${#fields.hasErrors('loginId')} ? 'error-msg' : ''"
                      th:text="${#fields.hasErrors('loginId')} ? ${#fields.errors('loginId')[0]} : ''"></span>

                <input type="password" th:field="*{password}" placeholder="비밀번호 (8자 이상, 영문+숫자+특수문자)" required>
                <span id="password-format-msg" class="msg"
                      th:classappend="${#fields.hasErrors('password')} ? 'error-msg' : ''"
                      th:text="${#fields.hasErrors('password')} ? ${#fields.errors('password')[0]} : ''"></span>

                <input type="password" th:field="*{passwordConfirm}" placeholder="비밀번호를 다시 입력해주세요" required>
                <span id="password-msg" class="msg"
                      th:classappend="${#fields.hasErrors('passwordConfirm')} ? 'error-msg' : ''"
                      th:text="${#fields.hasErrors('passwordConfirm')} ? ${#fields.errors('passwordConfirm')[0]} : ''"></span>

                <input type="text" th:field="*{phone}" placeholder="전화번호" required>
                <span class="msg error-msg" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>

                <div class="input-box">
                    <input type="email" th:field="*{email}" placeholder="이메일" required>
                    <button type="button" id="check-email">중복 체크</button>
                </div>
                <span id="email-msg" class="msg"
                      th:classappend="${#fields.hasErrors('email')} ? 'error-msg' : ''"
                      th:text="${#fields.hasErrors('email')} ? ${#fields.errors('email')[0]} : ''"></span>

                <button class="join-btn" type="submit">회원가입</button>

                <p class="join-help">
                    이미 계정이 있으신가요?
                    <a th:href="@{/members/login}">로그인</a>
                </p>
            </form>
        </div>
    </th:block>
</body>
</html>
